<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل الملف المشترك</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background-color: #1e293b;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        .icon { font-size: 60px; margin-bottom: 20px; color: #38bdf8; }
        h2 { margin: 0 0 10px 0; color: #f8fafc; }
        .file-name {
            color: #38bdf8;
            font-weight: bold;
            word-break: break-all;
            margin-bottom: 25px;
            background: #334155;
            padding: 10px;
            border-radius: 8px;
        }
        .btn-download {
            display: inline-block;
            background-color: #22c55e;
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 18px;
            width: 80%;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3);
            transition: 0.2s;
        }
        .btn-download:hover { background-color: #16a34a; transform: translateY(-2px); }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon">📁</div>
        <h2>ملف جاهز للتحميل</h2>
        <p style="color: #94a3b8;">تم مشاركة هذا الملف معك وسيحذف بعد ساعة</p>
        <div id="fileName" class="file-name">جاري جلب اسم الملف...</div>
        <a id="downloadBtn" href="#" class="btn-download">تحميل الملف الآن 📥</a>
    </div>

    <script>
        // كود معدل وذكي متوافق مع السيرفر الجديد 100%
        const urlParams = new URLSearchParams(window.location.search);
        const fileParam = urlParams.get('file'); // الاسم المشفر على السيرفر
        const originalName = urlParams.get('name'); // الاسم الأصلي الممرر من السيرفر

        if (fileParam) {
            // إذا السيرفر بعث الاسم الأصلي نستخدمه فوراً، وإلا بنجيبه بالطريقة القديمة احتياطاً
            const displayName = originalName ? decodeURIComponent(originalName) : fileParam.substring(fileParam.indexOf('-') + 1);
            document.getElementById('fileName').textContent = displayName;
            
            // 🎯 التعديل الذهبي: التوجيه لمجلد /uploads/ الصحيح بالسيرفر
            document.getElementById('downloadBtn').href = `/uploads/${fileParam}`;
            document.getElementById('downloadBtn').setAttribute('download', displayName);
        } else {
            document.getElementById('fileName').textContent = "خطأ: الملف غير موجود أو انتهت صلاحيته!";
            document.getElementById('downloadBtn').style.display = "none";
        }
    </script>
</body>
</html>
